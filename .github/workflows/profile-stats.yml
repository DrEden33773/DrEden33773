name: Refresh profile data
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/**'
      - 'fonts/**'
      - 'generate-assets.py'
      - 'pyproject.toml'
      - 'uv.lock'
permissions:
  contents: write
concurrency:
  group: profile-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'DrEden33773/DrEden33773'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.9.7'
      - run: uv sync --frozen
      - name: Check Python
        run: |
          uv run --frozen basedpyright
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Fetch public profile data
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/update-stats.py
      - name: Render profile components
        run: uv run --frozen python scripts/render-stats.py
      - name: Save refreshed components
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github.json assets/github-*.svg assets/project-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile data'
            git push
          fi
